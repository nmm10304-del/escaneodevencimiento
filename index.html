<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente de Almacén - Promart</title>
    <!-- Librería ultraligera para procesar archivos Excel (.xlsx) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-image: url("https://backendproyecta.proyecta.net.pe/storage/projects/1615255868.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            max-width: 480px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.25);
            text-align: center;
            box-sizing: border-box;
        }
        
        /* LOGO PROMART: Interactivo únicamente en PC */
        .logo {
            width: 150px;
            display: block;
            margin: 0 auto 15px;
            user-select: none;
        }

        @media (min-width: 769px) {
            .logo-pc {
                cursor: pointer;
                transition: transform 0.2s;
            }
            .logo-pc:hover {
                transform: scale(1.05);
            }
        }

        /* Input de archivo totalmente oculto */
        #excel-input-oculto {
            display: none;
        }

        h2 { 
            color: #ff6a00; 
            margin-top: 0; 
            font-size: 22px;
            border-bottom: 2px solid #ff6a00;
            padding-bottom: 8px;
        }
        p { color: #444; font-size: 14px; margin: 5px 0 15px; }
        
        .seccion-lectura {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            border: 2px solid #ff6a00;
            margin-bottom: 15px;
        }

        .input-pocket {
            width: 100%;
            padding: 14px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            border: 2px solid #333;
            border-radius: 8px;
            box-sizing: border-box;
            outline: none;
            color: #212529;
            background-color: #f8f9fa;
        }
        .input-pocket:focus {
            border-color: #ff6a00;
            background-color: #fff;
            box-shadow: 0 0 8px rgba(255, 106, 0, 0.4);
        }

        .btn-buscar {
            background: #ff6a00;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            width: 100%;
            transition: background 0.2s;
        }
        .btn-buscar:hover { background: #e65c00; }
        .btn-buscar:disabled {
            background: #cccccc !important;
            cursor: not-allowed;
        }

        .resultado-box {
            margin-top: 15px;
            padding: 15px;
            border-radius: 8px;
            background: #fdfdfd;
            border: 1px solid #ddd;
            text-align: left;
        }
        .resultado-box h3 { margin: 0 0 10px 0; color: #ff6a00; font-size: 16px; font-weight: bold; }
        .dato { font-size: 16px; margin: 8px 0; color: #333; word-break: break-word; }
        .resaltado { font-weight: bold; color: #28a745; font-size: 18px; }
        .no-registra { font-weight: bold; color: #6c757d; font-size: 16px; }
        .error { color: #dc3545; font-weight: bold; }
        .info-status { font-size: 13px; color: #28a745; text-align: center; margin-top: 10px; font-weight: bold; }

        .seccion-juliana {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px dashed #ccc;
            text-align: center;
        }
        input {
            width: 100%;
            padding: 11px;
            margin-top: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 15px;
            box-sizing: border-box;
        }
        input:disabled {
            background-color: #e9ecef;
            cursor: not-allowed;
        }

        .panel-resultado-juliano {
            margin-top: 12px;
            background: #fff;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #ff6a00;
            text-align: left;
            box-sizing: border-box;
        }
        .linea-res { font-size: 14px; margin: 5px 0; color: #333; }
        .vence-alerta { font-size: 16px; font-weight: bold; color: #ff6a00; }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] { -moz-appearance: textfield; }
    </style>
</head>
<body>

<div class="container">
    <!-- LOGO PROMART: Carga oculta únicamente habilitada en PC -->
    <img src="https://upload.wikimedia.org/wikipedia/commons/1/11/Promart_logo_2019.svg" alt="Promart" id="img-logo" class="logo logo-pc" onclick="activarCargadorOcultoPC()">
    
    <!-- Input oculto para carga de Excel -->
    <input type="file" id="excel-input-oculto" accept=".xlsx, .xls, .json" onchange="procesarArchivoExcel(event)">

    <h2>FECHA DE VENCIMIENTO</h2>
    <p>Escanea o digita el SKU</p>

    <div class="seccion-lectura">
        <!-- Input con filtro estricto a SOLO NÚMEROS y teclado numérico forzado -->
        <input type="text" id="input-escaneo" class="input-pocket" inputmode="numeric" pattern="[0-9]*" placeholder="Escanea o escribe aquí..." autofocus autocomplete="off" oninput="filtrarSoloNumeros(this)">
        <button class="btn-buscar" onclick="procesarBusquedaManual()">BUSCAR PRODUCTO</button>
    </div>

    <div class="resultado-box">
        <h3>Resultado de la Búsqueda:</h3>
        <div id="txt-desc" class="dato"><b>Descripción:</b> <span class="error">---</span></div>
        <div id="txt-sku" class="dato"><b>SKU:</b> ---</div>
        <div id="txt-vida" class="dato"><b>Vida útil:</b> <span id="vida-val" class="no-registra">---</span></div>
    </div>
    <div id="txt-status" class="info-status">Esperando datos...</div>

    <div class="seccion-juliana">
        <h2>Consulta Juliana + Vencimiento</h2>
        <p>Calcula la fecha real de fabricación y proyecta el vencimiento exacto</p>
        
        <!-- Inputs numéricos bloqueados inicialmente -->
        <input type="number" id="anio" inputmode="numeric" pattern="[0-9]*" placeholder="Inserte el año (Ej: 2026)" disabled oninput="limitarYCalcular(this, 4)">
        <input type="number" id="juliano" inputmode="numeric" pattern="[0-9]*" placeholder="Inserte los 3 dígitos (Ej: 198)" disabled oninput="limitarYCalcular(this, 3)">
        
        <button id="btn-calcular-juliano" class="btn-buscar" disabled onclick="convertirFechaJulianaCompleta()">Convertir y Calcular</button>
        
        <div class="panel-resultado-juliano">
            <div id="res-fabricacion" class="linea-res"><b>Fecha Real:</b> Esperando producto con vida útil...</div>
            <div id="res-vencimiento" class="linea-res"><b>Vence el:</b> ---</div>
        </div>
    </div>
</div>

<script>
    let eanASkuMap = {};       
    let maestroSkuMap = {};    
    let mesesVidaUtilActual = 0;

    // Filtro para impedir cualquier carácter que no sea número
    function filtrarSoloNumeros(elem) {
        elem.value = elem.value.replace(/\D/g, '');
    }

    function limpiarCodigo(codigo) {
        return String(codigo).replace(/\D/g, '').trim();
    }

    function actualizarHoraStatus(horaGuardada) {
        let horaStr = horaGuardada || new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        document.getElementById('txt-status').innerText = `✅ Última actualización a las ${horaStr}`;
    }

    // Carga oculta en el logo activada SOLO si es PC
    function activarCargadorOcultoPC() {
        let esMovil = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || (window.innerWidth <= 768);
        if (!esMovil) {
            document.getElementById('excel-input-oculto').click();
        }
    }

    function inicializarMemoriaYArchivos() {
        let maestroGuardado = localStorage.getItem('promart_maestro_sku');
        let horaGuardada = localStorage.getItem('promart_hora_actualizacion');

        if (maestroGuardado) {
            try {
                maestroSkuMap = JSON.parse(maestroGuardado);
                actualizarHoraStatus(horaGuardada);
            } catch (e) {
                console.warn("Inicializando memoria...");
            }
        }

        cargarArchivosBase();
    }

    function cargarArchivosBase() {
        let timestamp = new Date().getTime();
        let peticiones = [];

        for (let i = 1; i <= 50; i++) {
            let numStr = i < 10 ? `0${i}` : `${i}`;
            peticiones.push(
                fetch(`${numStr}.json?v=${timestamp}`)
                .then(res => res.ok ? res.json() : null)
                .catch(() => null)
            );
        }

        Promise.all(peticiones).then(listas => {
            listas.forEach(lista => {
                if (lista && Array.isArray(lista)) {
                    lista.forEach(item => {
                        let skuVal = item["SKU"] || item["sku"] || item["Articulo"] || "";
                        let eanVal = item["EAN"] || item["ean"] || item["Código de barras"] || item["CÃ³digo de barras"] || "";
                        let descVal = item["DESCRIPCIÓN"] || item["DESCRIPCION"] || item["Descripción"] || item["Descrip Articulo"] || "";

                        let skuLimpio = limpiarCodigo(skuVal);
                        let eanLimpio = limpiarCodigo(eanVal);

                        if (eanLimpio && skuLimpio) {
                            eanASkuMap[eanLimpio] = { sku: skuLimpio, descripcion: descVal };
                            let eanSinCeros = eanLimpio.replace(/^0+/, '');
                            if (eanSinCeros !== eanLimpio && eanSinCeros !== "") {
                                eanASkuMap[eanSinCeros] = { sku: skuLimpio, descripcion: descVal };
                            }
                        }
                    });
                }
            });
            if (!localStorage.getItem('promart_hora_actualizacion')) {
                actualizarHoraStatus();
            }
            document.getElementById('input-escaneo').focus();
        });
    }

    function procesarArchivoExcel(event) {
        let file = event.target.files[0];
        if (!file) return;

        let reader = new FileReader();

        if (file.name.endsWith('.xlsx') || file.name.endsWith('.xls')) {
            reader.onload = function (e) {
                let data = new Uint8Array(e.target.result);
                let workbook = XLSX.read(data, { type: 'array' });
                let primeraHoja = workbook.SheetNames[0];
                let jsonExcel = XLSX.utils.sheet_to_json(workbook.Sheets[primeraHoja]);

                procesarDatosDeExcel(jsonExcel);
            };
            reader.readAsArrayBuffer(file);
        } else if (file.name.endsWith('.json')) {
            reader.onload = function (e) {
                try {
                    let jsonExcel = JSON.parse(e.target.result);
                    procesarDatosDeExcel(jsonExcel);
                } catch (err) {
                    console.error("Error al leer el JSON.");
                }
            };
            reader.readAsText(file);
        }
    }

    function procesarDatosDeExcel(filas) {
        if (!Array.isArray(filas)) return;

        maestroSkuMap = {};

        filas.forEach(item => {
            let skuVal = "", descVal = "", vidaVal = "0";

            for (let llave in item) {
                let keyMin = llave.toLowerCase();
                let valStr = String(item[llave]).trim();

                if ((keyMin.includes("sku") || keyMin.includes("art") || keyMin.includes("mat")) && valStr.length >= 4 && valStr.length <= 8 && !isNaN(valStr)) {
                    skuVal = valStr;
                }
                if (keyMin.includes("descrip") || (keyMin.includes("articulo") && valStr.match(/[a-zA-Z]/))) {
                    descVal = valStr;
                }
                if (keyMin.includes("vida") || keyMin.includes("util") || keyMin.includes("fv")) {
                    vidaVal = valStr;
                }
            }

            let skuLimpio = limpiarCodigo(skuVal);
            if (skuLimpio) {
                maestroSkuMap[skuLimpio] = {
                    sku: skuLimpio,
                    descripcion: descVal || "Sin descripción",
                    vidaUtil: vidaVal
                };
                let skuSinCeros = skuLimpio.replace(/^0+/, '');
                if (skuSinCeros !== skuLimpio && skuSinCeros !== "") {
                    maestroSkuMap[skuSinCeros] = maestroSkuMap[skuLimpio];
                }
            }
        });

        let horaActual = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        try {
            localStorage.setItem('promart_maestro_sku', JSON.stringify(maestroSkuMap));
            localStorage.setItem('promart_hora_actualizacion', horaActual);
        } catch(e) {
            console.warn("Memoria interna completa.");
        }

        // Mensaje discreto en la barra inferior sin alertas emergentes
        document.getElementById('txt-status').innerText = `✅ Base de datos de FV actualizada correctamente (${horaActual})`;
        document.getElementById('input-escaneo').focus();
    }

    // Eventos del scanner Pocket Honeywell
    document.getElementById('input-escaneo').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            procesarBusquedaManual();
        }
    });

    document.getElementById('anio').addEventListener('keypress', function (e) { if (e.key === 'Enter') convertirFechaJulianaCompleta(); });
    document.getElementById('juliano').addEventListener('keypress', function (e) { if (e.key === 'Enter') convertirFechaJulianaCompleta(); });
    document.getElementById('anio').addEventListener('blur', convertirFechaJulianaCompleta);
    document.getElementById('juliano').addEventListener('blur', convertirFechaJulianaCompleta);

    function limitarYCalcular(elem, maxLen) {
        elem.value = elem.value.slice(0, maxLen);
        convertirFechaJulianaCompleta();
    }

    function controlarEstadoCalculadora(habilitar) {
        let inputAnio = document.getElementById('anio');
        let inputJuliano = document.getElementById('juliano');
        let btnCalcular = document.getElementById('btn-calcular-juliano');

        if (habilitar) {
            inputAnio.disabled = false;
            inputJuliano.disabled = false;
            btnCalcular.disabled = false;
        } else {
            inputAnio.disabled = true;
            inputJuliano.disabled = true;
            btnCalcular.disabled = true;
            inputAnio.value = "";
            inputJuliano.value = "";
            document.getElementById('res-fabricacion').innerHTML = "<b>Fecha Real:</b> Esperando producto con vida útil...";
            document.getElementById('res-vencimiento').innerHTML = "<b>Vence el:</b> ---";
        }
    }

    function procesarBusquedaManual() {
        let inputElem = document.getElementById('input-escaneo');
        let lecturaIngresada = inputElem.value.trim();
        
        if (!lecturaIngresada) return;

        let codigoLimpio = limpiarCodigo(lecturaIngresada);
        let skuFinal = "";
        let descripcionFinal = "";
        let vidaUtilFinal = "0";

        if (eanASkuMap[codigoLimpio]) {
            skuFinal = eanASkuMap[codigoLimpio].sku;
            descripcionFinal = eanASkuMap[codigoLimpio].descripcion;
        } else {
            let codigoSinCeros = codigoLimpio.replace(/^0+/, '');
            if (eanASkuMap[codigoSinCeros]) {
                skuFinal = eanASkuMap[codigoSinCeros].sku;
                descripcionFinal = eanASkuMap[codigoSinCeros].descripcion;
            }
        }

        if (!skuFinal) {
            skuFinal = codigoLimpio;
        }

        let infoMaestra = maestroSkuMap[skuFinal] || maestroSkuMap[skuFinal.replace(/^0+/, '')];

        if (infoMaestra) {
            if (infoMaestra.descripcion && infoMaestra.descripcion !== "Sin descripción") {
                descripcionFinal = infoMaestra.descripcion;
            }
            vidaUtilFinal = infoMaestra.vidaUtil;
        }

        if (infoMaestra || descripcionFinal) {
            document.getElementById('txt-desc').innerHTML = `<b>Descripción:</b> ${descripcionFinal || "Sin descripción"}`;
            document.getElementById('txt-sku').innerHTML = `<b>SKU:</b> ${skuFinal}`;

            let numerosExtraidos = String(vidaUtilFinal).replace(/\D/g, '');
            mesesVidaUtilActual = numerosExtraidos !== "" ? parseInt(numerosExtraidos) : 0;
            
            if (mesesVidaUtilActual > 0) {
                let aniosCompletos = Math.floor(mesesVidaUtilActual / 12);
                let mesesRestantes = mesesVidaUtilActual % 12;
                let textoParentesis = "";

                if (aniosCompletos > 0) {
                    let etiquetaAnio = aniosCompletos === 1 ? "año" : "años";
                    if (mesesRestantes > 0) {
                        let etiquetaMes = mesesRestantes === 1 ? "mes" : "meses";
                        textoParentesis = `(${aniosCompletos} ${etiquetaAnio} y ${mesesRestantes} ${etiquetaMes})`;
                    } else {
                        textoParentesis = `(${aniosCompletos} ${etiquetaAnio})`;
                    }
                } else {
                    let etiquetaMes = mesesRestantes === 1 ? "mes" : "meses";
                    textoParentesis = `(${mesesRestantes} ${etiquetaMes})`;
                }
                
                document.getElementById('vida-val').className = "resaltado";
                document.getElementById('vida-val').innerText = `${mesesVidaUtilActual} meses ${textoParentesis}`;
                controlarEstadoCalculadora(true); // Desbloquea la calculadora Juliana
            } else {
                document.getElementById('vida-val').className = "no-registra";
                document.getElementById('vida-val').innerText = "No registra vida útil";
                controlarEstadoCalculadora(false); // Bloquea la calculadora Juliana
            }
            
            if(document.getElementById("anio").value !== "" && document.getElementById("juliano").value !== "") {
                convertirFechaJulianaCompleta();
            }
        } else {
            document.getElementById('txt-desc').innerHTML = `<span class='error'>Código/SKU: ${lecturaIngresada} <br>Producto no registrado</span>`;
            document.getElementById('txt-sku').innerHTML = `<b>SKU:</b> ---`;
            document.getElementById('vida-val').className = "no-registra";
            document.getElementById('vida-val').innerText = "---";
            mesesVidaUtilActual = 0;
            controlarEstadoCalculadora(false); // Bloquea la calculadora Juliana
        }

        inputElem.value = "";
        inputElem.focus();
    }

    function esBisiesto(anio) {
        return (anio % 4 === 0 && anio % 100 !== 0) || (anio % 400 === 0);
    }

    function convertirFechaJulianaCompleta(){
        if (mesesVidaUtilActual <= 0) return;

        let anioInput = document.getElementById("anio").value;
        let julianoInput = document.getElementById("juliano").value;
        let contenedorFab = document.getElementById("res-fabricacion");
        let contenedorVen = document.getElementById("res-vencimiento");

        if(anioInput === "" || julianoInput === ""){
            contenedorFab.innerHTML = "<b>Fecha Real:</b> Ingrese los datos de fabricación";
            contenedorVen.innerHTML = "<b>Vence el:</b> ---";
            return;
        }

        let anio = parseInt(anioInput.replace(/\D/g,''));
        let juliano = parseInt(julianoInput.replace(/\D/g,''));

        let maxDias = esBisiesto(anio) ? 366 : 365;
        if(juliano < 1 || juliano > maxDias || anio < 1000){
            contenedorFab.innerHTML = "<span style='color: #dc3545;'>Año o día juliano incorrecto</span>";
            contenedorVen.innerHTML = "<b>Vence el:</b> ---";
            return;
        }

        let fechaFabricacion = new Date(anio, 0);
        fechaFabricacion.setDate(juliano);

        let diaF = fechaFabricacion.getDate().toString().padStart(2, '0');
        let mesF = (fechaFabricacion.getMonth() + 1).toString().padStart(2, '0');
        contenedorFab.innerHTML = `<b>Fecha Real:</b> ${diaF}/${mesF}/${anio}`;

        let fechaVencimiento = new Date(fechaFabricacion.getTime());
        fechaVencimiento.setMonth(fechaVencimiento.getMonth() + mesesVidaUtilActual);

        let diaV = fechaVencimiento.getDate().toString().padStart(2, '0');
        let mesV = (fechaVencimiento.getMonth() + 1).toString().padStart(2, '0');
        let anioV = fechaVencimiento.getFullYear();

        let nombresMeses = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
        contenedorVen.innerHTML = `<b>Vence el:</b> <span class="vence-alerta">${diaV}/${mesV}/${anioV} (${nombresMeses[fechaVencimiento.getMonth()]})</span>`;
    }

    window.onload = inicializarMemoriaYArchivos;
</script>
</body>
</html>
