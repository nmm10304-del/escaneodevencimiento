<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente de Almacén - Promart</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-image: url("https://backendproyecta.proyecta.net.pe/storage/projects/1615255868.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            max-width: 480px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.25);
            text-align: center;
            box-sizing: border-box;
        }
        .logo {
            width: 150px;
            display: block;
            margin: 0 auto 15px;
        }
        h2 { 
            color: #ff6a00; 
            margin-top: 0; 
            font-size: 22px;
            border-bottom: 2px solid #ff6a00;
            padding-bottom: 8px;
        }
        p { color: #444; font-size: 14px; margin: 5px 0 15px; }
        
        .seccion-lectura {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            border: 2px solid #ff6a00;
            margin-bottom: 15px;
        }

        .input-pocket {
            width: 100%;
            padding: 14px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            border: 2px solid #333;
            border-radius: 8px;
            box-sizing: border-box;
            outline: none;
            color: #212529;
            background-color: #f8f9fa;
        }
        .input-pocket:focus {
            border-color: #ff6a00;
            background-color: #fff;
            box-shadow: 0 0 8px rgba(255, 106, 0, 0.4);
        }

        .btn-buscar {
            background: #ff6a00;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            width: 100%;
            transition: background 0.2s;
        }
        .btn-buscar:hover { background: #e65c00; }

        .resultado-box {
            margin-top: 15px;
            padding: 15px;
            border-radius: 8px;
            background: #fdfdfd;
            border: 1px solid #ddd;
            text-align: left;
        }
        .resultado-box h3 { margin: 0 0 10px 0; color: #ff6a00; font-size: 16px; font-weight: bold; }
        .dato { font-size: 16px; margin: 8px 0; color: #333; word-break: break-word; }
        .resaltado { font-weight: bold; color: #28a745; font-size: 18px; }
        .error { color: #dc3545; font-weight: bold; }
        .info-status { font-size: 13px; color: #666; text-align: center; margin-top: 10px; font-weight: bold; }

        .seccion-juliana {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px dashed #ccc;
            text-align: center;
        }
        input, button {
            width: 100%;
            padding: 11px;
            margin-top: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 14px;
            box-sizing: border-box;
        }
        .panel-resultado-juliano {
            margin-top: 12px;
            background: #fff;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #ff6a00;
            text-align: left;
            box-sizing: border-box;
        }
        .linea-res { font-size: 14px; margin: 5px 0; color: #333; }
        .vence-alerta { font-size: 16px; font-weight: bold; color: #ff6a00; }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] { -moz-appearance: textfield; }
    </style>
</head>
<body>

<div class="container">
    <img src="https://upload.wikimedia.org/wikipedia/commons/1/11/Promart_logo_2019.svg" alt="Promart" class="logo">
    
    <h2>FECHA DE VENCIMIENTO</h2>
    <p>Escanea o digita el SKU</p>

    <div class="seccion-lectura">
        <input type="text" id="input-escaneo" class="input-pocket" placeholder="Escanea o escribe aquí..." autofocus autocomplete="off">
        <button class="btn-buscar" onclick="procesarBusquedaManual()">BUSCAR PRODUCTO</button>
    </div>

    <div class="resultado-box">
        <h3>Resultado de la Búsqueda:</h3>
        <div id="txt-desc" class="dato"><b>Descripción:</b> <span class="error">---</span></div>
        <div id="txt-sku" class="dato"><b>SKU:</b> ---</div>
        <div id="txt-vida" class="dato"><b>Vida útil (meses):</b> <span id="vida-val" class="resaltado">---</span></div>
    </div>
    <div id="txt-status" class="info-status">Sincronizando con GitHub...</div>

    <div class="seccion-juliana">
        <h2>Consulta Juliana + Vencimiento</h2>
        <p>Calcula la fecha real de fabricación y proyecta el vencimiento exacto</p>
        
        <input type="number" id="anio" placeholder="Inserte el año (Ej: 2026)" oninput="this.value=this.value.slice(0,4)">
        <input type="number" id="juliano" placeholder="Inserte los 3 dígitos (Ej: 198)" oninput="this.value=this.value.slice(0,3)">
        
        <button class="btn-buscar" onclick="convertirFechaJulianaCompleta()">Convertir y Calcular</button>
        
        <div class="panel-resultado-juliano">
            <div id="res-fabricacion" class="linea-res"><b>Fecha Real:</b> Esperando datos...</div>
            <div id="res-vencimiento" class="linea-res"><b>Vence el:</b> ---</div>
        </div>
    </div>
</div>

<script>
    let eanASkuMap = {};       // Mapa 1: EAN -> SKU (Doble filtro)
    let maestroSkuMap = {};    // Mapa 2: SKU -> { Descripción, VidaÚtil }
    let mesesVidaUtilActual = 0;

    function limpiarCodigo(codigo) {
        return String(codigo).replace(/\D/g, '').trim();
    }

    function cargarDatosYArrancar() {
        let peticiones = [];
        let archivosEncontrados = 0;
        
        // Genera timestamp para romper la memoria caché de GitHub Pages y forzar la lectura del nuevo archivo
        let versionUnica = new Date().getTime();

        // 1. Cargar Archivo Maestro Data.json (Si existe)
        fetch(`Data.json?v=${versionUnica}`)
        .then(res => res.json())
        .then(dataMaestra => {
            if (Array.isArray(dataMaestra)) {
                dataMaestra.forEach(item => {
                    let skuVal = "", descVal = "", vidaVal = "0";

                    for (let llave in item) {
                        let keyMin = llave.toLowerCase();
                        let valStr = String(item[llave]).trim();

                        if ((keyMin.includes("sku") || keyMin.includes("art") || keyMin.includes("mat")) && valStr.length >= 4 && valStr.length <= 8 && !isNaN(valStr)) {
                            skuVal = valStr;
                        }
                        if (keyMin.includes("descrip") || (keyMin.includes("articulo") && valStr.match(/[a-zA-Z]/))) {
                            descVal = valStr;
                        }
                        if (keyMin.includes("vida") || keyMin.includes("util") || keyMin.includes("fv")) {
                            vidaVal = valStr;
                        }
                    }

                    let skuLimpio = limpiarCodigo(skuVal);
                    if (skuLimpio) {
                        maestroSkuMap[skuLimpio] = {
                            descripcion: descVal || "Sin descripción",
                            sku: skuLimpio,
                            vidaUtil: vidaVal
                        };
                        let skuSinCeros = skuLimpio.replace(/^0+/, '');
                        if (skuSinCeros !== skuLimpio && skuSinCeros !== "") {
                            maestroSkuMap[skuSinCeros] = maestroSkuMap[skuLimpio];
                        }
                    }
                });
            }
        })
        .catch(() => console.log("Cargando base de datos principal..."));

        // 2. Cargar Archivos FV-1.json a FV-43.json sin guardar memoria caché
        for (let i = 1; i <= 43; i++) {
            peticiones.push(
                fetch(`FV-${i}.json?v=${versionUnica}`)
                .then(res => {
                    if (!res.ok) throw new Error(`Falta`);
                    archivosEncontrados++;
                    return res.json();
                })
                .catch(() => null)
            );
        }

        Promise.all(peticiones)
        .then((todasLasListas) => {
            todasLasListas.forEach(lista => {
                if (lista && Array.isArray(lista)) {
                    lista.forEach(item => {
                        let skuVal = "", eanVal = "", descVal = "", vidaVal = "0";

                        for (let llave in item) {
                            let keyMin = llave.toLowerCase();
                            let valStr = String(item[llave]).trim();

                            if ((keyMin.includes("sku") || keyMin.includes("art") || keyMin.includes("mat")) && valStr.length >= 4 && valStr.length <= 8 && !isNaN(valStr)) {
                                skuVal = valStr;
                            }
                            if (keyMin.includes("descrip") || (keyMin.includes("articulo") && valStr.match(/[a-zA-Z]/))) {
                                descVal = valStr;
                            }
                            if (keyMin.includes("vida") || keyMin.includes("util") || keyMin.includes("fv")) {
                                vidaVal = valStr;
                            }
                            if (keyMin.includes("barr") || keyMin.includes("ean") || keyMin.includes("cod")) {
                                eanVal = valStr;
                            }
                        }

                        let skuLimpio = limpiarCodigo(skuVal);
                        let eanLimpio = limpiarCodigo(eanVal);

                        if (skuLimpio && !maestroSkuMap[skuLimpio]) {
                            maestroSkuMap[skuLimpio] = {
                                descripcion: descVal || "Sin descripción",
                                sku: skuLimpio,
                                vidaUtil: vidaVal
                            };
                            let skuSinCeros = skuLimpio.replace(/^0+/, '');
                            if (skuSinCeros !== skuLimpio && skuSinCeros !== "") {
                                maestroSkuMap[skuSinCeros] = maestroSkuMap[skuLimpio];
                            }
                        }

                        if (eanLimpio && skuLimpio) {
                            eanASkuMap[eanLimpio] = skuLimpio;
                            let eanSinCeros = eanLimpio.replace(/^0+/, '');
                            if (eanSinCeros !== eanLimpio && eanSinCeros !== "") {
                                eanASkuMap[eanSinCeros] = skuLimpio;
                            }
                        }
                    });
                }
            });

            let horaSincro = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            document.getElementById('txt-status').innerText = `✅ La última actualización de 'el excel de FV' (${archivosEncontrados} listas) sincronizada a las ${horaSincro} hrs.`;
            document.getElementById('input-escaneo').focus();
        })
        .catch(err => {
            console.error(err);
            document.getElementById('txt-status').innerHTML = "<span class='error'>⚠️ Error al sincronizar 'el excel de FV'.</span>";
        });
    }

    // Disparo automático al usar el láser del Pocket Honeywell
    document.getElementById('input-escaneo').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            procesarBusquedaManual();
        }
    });

    function procesarBusquedaManual() {
        let inputElem = document.getElementById('input-escaneo');
        let lecturaIngresada = inputElem.value.trim();
        
        if (!lecturaIngresada) return;

        let codigoLimpio = limpiarCodigo(lecturaIngresada);
        let skuEncontrado = "";

        // LÓGICA DE DOBLE FILTRO
        if (maestroSkuMap[codigoLimpio]) {
            skuEncontrado = codigoLimpio;
        } else if (eanASkuMap[codigoLimpio]) {
            skuEncontrado = eanASkuMap[codigoLimpio];
        } else {
            let codigoSinCeros = codigoLimpio.replace(/^0+/, '');
            if (maestroSkuMap[codigoSinCeros]) {
                skuEncontrado = codigoSinCeros;
            } else if (eanASkuMap[codigoSinCeros]) {
                skuEncontrado = eanASkuMap[codigoSinCeros];
            }
        }

        if (!skuEncontrado) {
            for (let claveSku in maestroSkuMap) {
                if (claveSku === codigoLimpio || claveSku.endsWith(codigoLimpio) || codigoLimpio.endsWith(claveSku)) {
                    if (claveSku.length >= 4) {
                        skuEncontrado = claveSku;
                        break;
                    }
                }
            }
        }

        let producto = maestroSkuMap[skuEncontrado];

        if (producto) {
            document.getElementById('txt-desc').innerHTML = `<b>Descripción:</b> ${producto.descripcion}`;
            document.getElementById('txt-sku').innerHTML = `<b>SKU:</b> ${producto.sku}`;

            let numerosExtraidos = String(producto.vidaUtil).replace(/\D/g, '');
            mesesVidaUtilActual = numerosExtraidos !== "" ? parseInt(numerosExtraidos) : 0;
            
            if (mesesVidaUtilActual > 0) {
                let aniosCompletos = Math.floor(mesesVidaUtilActual / 12);
                let mesesRestantes = mesesVidaUtilActual % 12;
                let textoParentesis = "";

                if (aniosCompletos > 0) {
                    let etiquetaAnio = aniosCompletos === 1 ? "año" : "años";
                    if (mesesRestantes > 0) {
                        let etiquetaMes = mesesRestantes === 1 ? "mes" : "meses";
                        textoParentesis = `(${aniosCompletos} ${etiquetaAnio} y ${mesesRestantes} ${etiquetaMes})`;
                    } else {
                        textoParentesis = `(${aniosCompletos} ${etiquetaAnio})`;
                    }
                } else {
                    let etiquetaMes = mesesRestantes === 1 ? "mes" : "meses";
                    textoParentesis = `(${mesesRestantes} ${etiquetaMes})`;
                }
                
                document.getElementById('vida-val').innerText = `${mesesVidaUtilActual} ${textoParentesis}`;
            } else {
                document.getElementById('vida-val').innerText = "0";
            }
            
            if(document.getElementById("anio").value !== "" && document.getElementById("juliano").value !== "") {
                convertirFechaJulianaCompleta();
            }
        } else {
            document.getElementById('txt-desc').innerHTML = `<span class='error'>Código/SKU: ${lecturaIngresada} <br>Producto no registrado</span>`;
            document.getElementById('txt-sku').innerHTML = `<b>SKU:</b> ---`;
            document.getElementById('vida-val').innerText = "---";
            mesesVidaUtilActual = 0;
        }

        inputElem.value = "";
        inputElem.focus();
    }

    function esBisiesto(anio) {
        return (anio % 4 === 0 && anio % 100 !== 0) || (anio % 400 === 0);
    }

    function convertirFechaJulianaCompleta(){
        let anioInput = document.getElementById("anio").value;
        let julianoInput = document.getElementById("juliano").value;
        let contenedorFab = document.getElementById("res-fabricacion");
        let contenedorVen = document.getElementById("res-vencimiento");

        if(anioInput === "" || julianoInput === ""){
            contenedorFab.innerHTML = "<span style='color: #dc3545;'>Completa los campos</span>";
            return;
        }

        let anio = parseInt(anioInput.replace(/\D/g,''));
        let juliano = parseInt(julianoInput.replace(/\D/g,''));

        let maxDias = esBisiesto(anio) ? 366 : 365;
        if(juliano < 1 || juliano > maxDias || anio < 1000){
            contenedorFab.innerHTML = "<span style='color: #dc3545;'>Año o código incorrecto</span>";
            return;
        }

        let fechaFabricacion = new Date(anio, 0);
        fechaFabricacion.setDate(juliano);

        let diaF = fechaFabricacion.getDate().toString().padStart(2, '0');
        let mesF = (fechaFabricacion.getMonth() + 1).toString().padStart(2, '0');
        contenedorFab.innerHTML = `<b>Fecha Real:</b> ${diaF}/${mesF}/${anio}`;

        if (mesesVidaUtilActual > 0) {
            let fechaVencimiento = new Date(fechaFabricacion.getTime());
            fechaVencimiento.setMonth(fechaVencimiento.getMonth() + mesesVidaUtilActual);

            let diaV = fechaVencimiento.getDate().toString().padStart(2, '0');
            let mesV = (fechaVencimiento.getMonth() + 1).toString().padStart(2, '0');
            let anioV = fechaVencimiento.getFullYear();

            let nombresMeses = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
            contenedorVen.innerHTML = `<b>Vence el:</b> <span class="vence-alerta">${diaV}/${mesV}/${anioV} (${nombresMeses[fechaVencimiento.getMonth()]})</span>`;
        } else {
            contenedorVen.innerHTML = `<b>Vence el:</b> <span style='color: #666;'>Escanea un producto con vida útil primero</span>`;
        }
    }

    window.onload = cargarDatosYArrancar;
</script>
</body>
</html>
